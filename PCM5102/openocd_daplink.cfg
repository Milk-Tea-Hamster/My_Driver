# ============================================================
# DAPLink + STM32F407VET6 OpenOCD 配置文件
# ============================================================
# SWD 时钟: 10MHz
#
# 调试:  openocd -f openocd_daplink.cfg
# 烧录:  openocd -f openocd_daplink.cfg -c "program build/Debug/PCM5102.elf verify reset exit"
#

# ---- 调试器接口 ----
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 10000

# ---- 目标芯片 ----
set CHIPNAME stm32f407vet6
source [find target/stm32f4x.cfg]

# ---- 复位配置 ----
reset_config srst_nogate

# ---- 覆盖默认低速，全程保持 10MHz ----
stm32f407vet6.cpu configure -event reset-start { adapter speed 10000 }
stm32f407vet6.cpu configure -event reset-init  { adapter speed 10000 }
